name: 'Prerelease'

on:
  push:
    branches:
      - 'feature/**'
      - 'hotfix/**'

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Version'
    uses: ./.github/workflows/version.yml
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      release-type: prerelease

  build-test-pack:
    name: 'Build test and pack'
    needs: get-version
    uses: ./.github/workflows/build-test-dotnet.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: get-version
    uses: ./.github/workflows/sonar-dotnet.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
    secrets: inherit

  create-tag:
    name: 'Tag Validated Commit'
    needs: [get-version, build-test-pack, sonar-analysis]
    if: needs.sonar-analysis.outputs.quality-gate-status == 'PASSED'
    uses: ./.github/workflows/tag.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.sha }}
    secrets: inherit
