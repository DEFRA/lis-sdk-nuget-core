name: 'Release'

on:
  pull_request:
    branches: [main]
    types: [closed]

concurrency:
  group: main-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Version'
    if: github.event.pull_request.merged == true
    uses: DEFRA/lis-github-actions/.github/workflows/version.yml@89f3dfe9923b231b4df965d54a8c95e83c56ec30 # v0.9.0
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      branch: ${{ github.event.pull_request.head.ref }}
      release-type: stable

  build-test-pack:
    name: 'Build test and pack'
    needs: get-version
    uses: DEFRA/lis-github-actions/.github/workflows/build-test-dotnet.yml@89f3dfe9923b231b4df965d54a8c95e83c56ec30 # v0.9.0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: get-version
    uses: DEFRA/lis-github-actions/.github/workflows/sonar-dotnet.yml@89f3dfe9923b231b4df965d54a8c95e83c56ec30 # v0.9.0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      branch: main
    secrets: inherit

  create-tag:
    name: 'Tag Main'
    needs: [get-version, build-test-pack, sonar-analysis]
    if: needs.sonar-analysis.outputs.quality-gate-status == 'PASSED'
    uses: DEFRA/lis-github-actions/.github/workflows/tag.yml@89f3dfe9923b231b4df965d54a8c95e83c56ec30 # v0.9.0
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.event.pull_request.merge_commit_sha }}
    secrets: inherit
