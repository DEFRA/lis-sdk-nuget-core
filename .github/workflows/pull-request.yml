name: 'Pull Request Validation'

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  get-version:
    name: 'Calculate Version'
    uses: ./.github/workflows/version.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      branch: ${{ github.event.pull_request.head.ref }}
      release-type: prerelease

  build-test-pack:
    name: 'Build test and pack'
    needs: get-version
    uses: ./.github/workflows/build-test-dotnet.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.event.pull_request.head.sha }}

  sonar-analysis:
    name: 'Sonar Analysis'
    needs: get-version
    uses: ./.github/workflows/sonar-dotnet.yml
    with:
      version: ${{ needs.get-version.outputs.version }}
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  required-checks:
    name: 'Pull Request Validation'
    needs: [get-version, build-test-pack, sonar-analysis]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        env:
          GET_VERSION_RESULT: ${{ needs.get-version.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test-pack.result }}
          SONAR_ANALYSIS_RESULT: ${{ needs.sonar-analysis.result }}
        run: |
          results=(
            "get-version=$GET_VERSION_RESULT"
            "build-test=$BUILD_TEST_RESULT"
            "sonar-analysis=$SONAR_ANALYSIS_RESULT"
          )

          printf '%s\n' "${results[@]}"

          for result in "${results[@]}"; do
            if [[ "$result" != *=success ]]; then
              echo "Required job did not succeed: $result" >&2
              exit 1
            fi
          done
