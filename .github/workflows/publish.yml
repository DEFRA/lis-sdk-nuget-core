name: 'Publish NuGet Packages'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Publish NuGet packages
        uses: DEFRA/lis-github-actions/.github/actions/publish-nuget@1a03c6a3bf26b0aae6a08210d77c2970bd7f4298 # unreleased; based on v0.9.0
        with:
          version: ${{ github.ref_name }}
          user: ${{ secrets.NUGET_USERNAME }}
