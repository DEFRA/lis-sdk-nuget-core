name: 'Publish NuGet Packages'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    uses: DEFRA/lis-github-actions/.github/workflows/publish-nuget.yml@89f3dfe9923b231b4df965d54a8c95e83c56ec30 # v0.9.0
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
