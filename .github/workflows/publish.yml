name: 'Publish Container Image'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: container-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    uses: ./.github/workflows/publish-nuget.yml
    secrets: inherit
