name: 'Publish NuGet Packages'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    uses: ./.github/workflows/publish-nuget.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
